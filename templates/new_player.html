<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="UTF-8" />
        <title>{{ title }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="/static/bootstrap5/css/bootstrap.min.css" />
        <link rel="stylesheet" href="/static/bootstrap5/icons/bootstrap-icons.css" />
        <link rel="stylesheet" href="/static/homepodcastsrv.css" />
    </head>
    <body>


            {{ avfiles_html|safe }}


        <div id="media-overlay" class="d-none">
            <div class="player-header">
                <small id="now-playing-title" class="text-truncate">Nothing playing</small>
                <div>
                    <button class="btn btn-sm btn-outline-light" onclick="toggleMinimize()">_</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="closePlayer()">X</button>
                </div>
            </div>
            <div id="media-content"></div>
        </div>
<!-- Episode Edit Modal -->
<div id="editEpisodeModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; justify-content:center; align-items:center;">
  <div style="background:#fff; padding:20px; border-radius:8px; max-width:600px; width:90%; max-height:90vh; overflow-y:auto; color:#000;">
    <h2>Edit Episode Metadata</h2>
    <input type="hidden" id="edit-file-path" />
    
    <label><strong>Title:</strong></label><br>
    <input type="text" id="edit-title" style="width:100%; margin-bottom:10px;" /><br>


    <label><strong>Description:</strong></label><br>
    <textarea id="edit-description" rows="4" style="width:100%; margin-bottom:10px;"></textarea><br>

    <div style="text-align:right;">
      <button type="button" onclick="closeEditModal()">Cancel</button>
      <button type="button" onclick="saveEpisodeData()" style="background:#007bff; color:#fff; border:none; padding:8px 16px; border-radius:4px;">Save Changes</button>
    </div>
  </div>
</div>

<!-- Playlist Edit Modal -->
<div id="editPlaylistModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; justify-content:center; align-items:center;">
  <div style="background:#fff; padding:20px; border-radius:8px; max-width:400px; width:90%; color:#000;">
    <h2>Edit Playlist Name</h2>
    <input type="hidden" id="edit-old-playlist-name" />
    
    <label><strong>Playlist Name:</strong></label><br>
    <input type="text" id="edit-new-playlist-name" style="width:100%; margin-bottom:15px;" /><br>

    <div style="text-align:right;">
      <button type="button" onclick="closePlaylistEditModal()">Cancel</button>
      <button type="button" onclick="savePlaylistData()" style="background:#007bff; color:#fff; border:none; padding:8px 16px; border-radius:4px;">Save</button>
    </div>
  </div>
</div>
        <script src="/static/bootstrap5/js/bootstrap.bundle.min.js"></script>
        <script src="/static/homepodcastsrv.js"></script>
        <script src="/static/homepodcastsrv-edit.js"></script>
    </body>
</html>
